<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영림 홈아트 필름 수량 계산기</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#f5f5f5;
    font-family:'Malgun Gothic',sans-serif;
}

.container{
    max-width:500px;
    margin:auto;
    background:#ffffff;
    border-radius:15px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#00a651;
    margin-bottom:5px;
}

.sub{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    box-sizing:border-box;
    margin-bottom:15px;
    font-size:16px;
}

button{
    width:100%;
    background:#00a651;
    color:white;
    border:none;
    padding:15px;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#008c45;
}

.result{
    margin-top:20px;
    padding:20px;
    background:#f0fff6;
    border:2px solid #00a651;
    border-radius:10px;
    text-align:left;
    display:none;
}

.result h2{
    color:#00a651;
    margin:0;
}

.notice{
    margin-top:20px;
    padding:15px;
    background:#fff8e8;
    border-radius:10px;
    font-size:14px;
    line-height:1.7;
}

.footer{
    margin-top:15px;
    text-align:center;
    color:#888;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>영림 홈아트</h1>
<div class="sub">필름 수량 계산기</div>

<label>폭(mm)</label>
<input type="text" inputmode="numeric" id="width" placeholder="예 : 3,530" onkeydown="if (event.keyCode === 13) document.getElementById('height').focus();"  oninput="addComma(this)" autofocus>

<label>높이(mm)</label>
<input type="text" inputmode="numeric" id="height" placeholder="예 : 2,280" onkeydown="if (event.keyCode === 13) calculateFilm();"  oninput="addComma(this)">

<button onclick="calculateFilm()">계산하기</button>

<div class="result" id="resultBox">
    <h2 id="resultText"></h2>
</div>

<div class="notice">
※ 계산된 수량은 최소 필요 수량입니다.<br>
※ 시공 여건이나 재단 손실을 고려하여 1~2M 추가 주문을 추천드립니다.
</div>

<div class="footer">
영림 홈아트
</div>

</div>

<script>
function calculateFilm(){

    const width = parseFloat(
		document.getElementById("width").value.replace(/,/g, '')
	);
    const height = parseFloat(
			document.getElementById("height").value.replace(/,/g, '')
	);

    if(!width || !height){
        alert("폭과 높이를 입력해주세요.");
        return;
    }

    const widthCount = Math.ceil(width / 1100);
    const meter = Math.ceil((widthCount * height) / 1000);

document.getElementById("resultText").innerHTML =
    "폭&nbsp;&nbsp;&nbsp;&nbsp;: <strong>" + width.toLocaleString('ko-KR') + "mm</strong><br>" +
    "높이 : <strong>" + height.toLocaleString('ko-KR') + "mm</strong><br><br>" +

    "<div style='text-align:center;margin-top:15px;'>" +
        "필요 수량" +
        "<strong style='color:#00a651;'>" +
            meter.toLocaleString('ko-KR') + "M" +
        "</strong>" +
    "</div>";

    document.getElementById("resultBox").style.display = "block";
	
	
	   // 입력값 초기화
    document.getElementById("width").value = "";
    document.getElementById("height").value = "";

    // 폭 입력칸으로 커서 이동
    document.getElementById("width").focus();
}

function addComma(obj) {
    let value = obj.value.replace(/[^0-9]/g, '');

    if (value) {
        obj.value = Number(value).toLocaleString('ko-KR');
    } else {
        obj.value = '';
    }
}


</script>

</body>
</html>
